name: Check

# ★ 265. 자동 점검 — PR 을 올리거나 고칠 때마다 빌드 + 시험 + 화면 점검을 돌립니다
#   하나라도 실패하면 PR 에 빨간 X 가 붙습니다 → 합치기 전에 알 수 있음 (공개 저장소라 무료)
#   시험 목록: package.json 의 "check" (주문 체결 반영 · 매수 예약 · 앱=파이프라인 오늘 살 것 · 여러 곳 같은 값) + 화면 5개
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # 297. 앱·서버가 직접 저장하는 실제 기록(매수 예약 · 내 보유)은 PR 로 바꾸면 안 됨
      #   (2026-11-08: 시험용 가짜 예약이 resv.json 으로 들어가 MSFT 실주문 위험) — 바뀌었으면 빨간 X
      - name: 실제 기록 파일 보호
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- public/data/resv.json public/data/watchlist.json || true)
          if [ -n "$changed" ]; then echo "::error::이 PR 이 실제 기록 파일을 바꿉니다: $changed — 앱·서버만 저장해야 합니다"; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 설치
        run: npm ci
      - name: 파이썬 문법
        run: python -m py_compile scripts/*.py scripts/snap/*.py
      # 워크플로 파일 문법 — 틀리면 GitHub 가 그 워크플로를 아예 못 돌림(2026-11-08 빈 env: 로 daily.yml 이 0초 실패)
      - name: 워크플로 문법
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: 빌드
        run: npm run build
      - name: 시험
        run: npm run check
      - name: 화면 점검 준비
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: 화면 점검
        run: |
          npx vite preview --port 4228 --strictPort &
          sleep 4
          python scripts/check_screens.py
