name: Hourly Stock Update

on:
  schedule:
    # ★ v2.5.0: 30분 갱신 (자정~3시 KST OFF)
    # 평일 03:00~08:30 KST (미국장 후반~마감)
    - cron: '0,30 18-23 * * 0-4'
    # 평일 09:00~23:30 KST (한국장 + 낮 + 미국 프리마켓)
    - cron: '0,30 0-14 * * 1-5'
    # 토요일 03:00~05:30 KST (미국 금요장 마감)
    - cron: '0,30 18-20 * * 5'
  workflow_dispatch:

jobs:
  update-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      COLLECT_MODE: hourly
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests
      - name: Run hourly update
        run: python scripts/fetch_yahoo.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || (
            git commit -m "🕐 $(date +%Y-%m-%d_%H:%M) 시간별 갱신"
            git pull --rebase origin main
            git push
          )
