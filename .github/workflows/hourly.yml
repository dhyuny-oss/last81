name: Hourly Stock Update

on:
  schedule:
    # ── 한국 장 (야후 실측: 정규 KST 09:00~15:00 · 시간외 ~18:00) ──
    - cron: '5 0 * * 1-5'     # KST 09:05  한국 개장 직후
    - cron: '30 3 * * 1-5'    # KST 12:30  한국 점심
    # ── 미국 장 (여름 정규 KST 22:30~05:00 / 겨울 23:30~06:00) ──
    - cron: '0 11 * * 1-5'    # KST 20:00  미국 프리마켓 (저녁 확인)
    - cron: '45 13 * * 1-5'   # KST 22:45  미국 개장 직후 (여름 EDT)
    - cron: '45 14 * * 1-5'   # KST 23:45  미국 개장 직후 (겨울 EST)
    - cron: '0 17 * * 1-5'    # KST 02:00  미국 장중
  workflow_dispatch:

jobs:
  update-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      COLLECT_MODE: hourly
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests
      - name: Run hourly update
        run: python scripts/fetch_yahoo.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || (
            git commit -m "🕐 $(date +%Y-%m-%d_%H:%M) 시간별 갱신"
            git pull --rebase origin main
            git push
          )
