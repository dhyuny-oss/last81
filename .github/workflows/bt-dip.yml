name: bt-dip (임시 검증 · 병합 안 함)
on:
  push:
    branches: [bt-dip]
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q yfinance pandas numpy
      - run: python scripts/tmp/bt_dip.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bt-dip, path: "bt_*" }
