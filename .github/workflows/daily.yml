name: Daily Data Update
on:
  schedule:
    # 한국 장마감 후 (월~금)
    - cron: '0 7 * * 1-5'    # UTC 07:00 = KST 16:00
    # 미국 장마감 후 (월~금 미국시간 = 화~토 KST 새벽)
    # cron의 1-5는 UTC 요일 → UTC 금요일 21:30 = KST 토요일 06:30 (금요일 미국장 마감)
    - cron: '30 21 * * 1-5'  # UTC 21:30 = KST 다음날 06:30
    # 백업 — GitHub free tier가 cron 가끔 스킵해서 토요일 09:00에 한 번 더 시도
    # 금요일 미국장 데이터가 누락된 경우를 위한 안전망 (주 1회 추가, 한도 영향 미미)
    - cron: '0 0 * * 6'      # UTC 00:00 토 = KST 09:00 토 (주말 백업)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      COLLECT_MODE: daily
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Fetch market data
        run: python scripts/fetch_yahoo.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.json public/data/alpha_hits.json
          git diff --staged --quiet || (
            git commit -m "📊 $(date +%Y-%m-%d) 데이터 업데이트"
            git pull --rebase origin main
            git push
          )
