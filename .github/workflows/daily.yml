name: Daily Data Update

# ─────────────────────────────────────────────────────────────
# ★ 이 파일 하나가 앱의 모든 데이터를 만듭니다
#
#   순서(262 · 단계마다 파일 하나 — 바꿔 끼울 땐 그 단계 파일만):
#     ① build_universe.py      → universe.json      종목 목록 (주 1회 · 토요일·수동 full)
#     ② fetch_financials_us.py → financials_us.json 미국 재무 (주 1회 · quarterly-us.yml)
#     ③ build_snapshot.py      → snapshot · market · today · bars   시세·지표·판단 (매번)
#                                 └ 오늘 살 것은 앱과 같은 함수(src/picks.js · scripts/pick_cli.mjs)
#     ④ notify.py              → 텔레그램
#     ⑤ 커밋 1회
#   공통 설정: config/rules.json(규칙 숫자) · config/market.json(휴장일)
#   한 job 안에서 순서대로 도니 두 워크플로가 동시에 push 하는 충돌이 없습니다. (공개 저장소라 실행 시간 무료)
#
# ★ 매매 결정은 이 두 시각 이후 값으로 하세요.
#   장중 갱신본은 아직 안 끝난 봉이라 흔들립니다. 검증에서도 확인 주기는
#   주 1회로 충분했고 요일 효과도 없었습니다.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # ★ 정각(0분) 예약은 전 세계 작업이 몰려 대기가 깁니다.
    #   실측(2026-08~09): 정각 예약 평균 5.7시간 지연 vs 30분 예약 평균 2.0시간.
    #   → 어긋난 분(17·23·13)으로 옮깁니다. 작업 자체는 45분 안에 끝납니다.
    - cron: '17 7 * * 1-5'   # UTC 07:17 = KST 16:17        한국 확정 종가
    - cron: '23 21 * * 1-5'  # UTC 21:23 = KST 다음날 06:23  미국 확정 종가
    - cron: '13 0 * * 6'     # UTC 00:13 토 = KST 토 09:13   주간 백업
    # ★ 보험 예약 (73) — 위 예약이 대기열에 밀려 늦을 때 대신 채웁니다. 이미 최신이면 몇 초 만에 끝납니다
    - cron: '17 8 * * 1-5'   # KST 17:17  한국 보험 1
    - cron: '17 9 * * 1-5'   # KST 18:17  한국 보험 2
    - cron: '23 22 * * 1-5'  # KST 07:23  미국 보험 1
    - cron: '23 23 * * 1-5'  # KST 08:23  미국 보험 2
  # ★ 102. 수동·외부 호출 — mode=daily 는 평일 갱신(감시 모드 약 5분·종목풀 교체 없음·이미 최신이면 건너뜀)
  #   Vercel 예약(vercel.json crons → /api/cron/*)이 평일 06·07·16·17시(KST)쯤 mode=daily 로 부릅니다 (깃허브 예약은 몇 시간씩 늦을 수 있어서)
  #   mode=full 은 예전 그대로 전체 스캔 + 종목풀 교체 (약 25분)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 전체 스캔·종목풀 교체(약 25분) / daily = 평일 갱신(약 5분·최신이면 건너뜀) / quick = 앱 🔄 버튼(약 5분·항상 실행)"
        type: choice
        options: [full, daily, quick]
        default: full

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'daily' && 'Daily refresh (daily)' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'quick' && 'Daily refresh (quick)' || 'Daily Data Update') }}

# 앞 실행이 아직 안 끝났으면 새로 시작하지 않습니다 (한도 낭비 방지)
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 코스닥 거래소 확인(.KS→.KQ 재조회)으로 2~4분 늘어납니다
    permissions:
      contents: write
    env:
    steps:
      - uses: actions/checkout@v4

      - name: 이미 최신이면 건너뜀 (보험·지연 예약용)
        id: fresh
        env:
          EV: ${{ github.event_name }}
          SCH: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as dt
          skip = "false"
          daily_call = os.environ.get("EV") == "workflow_dispatch" and os.environ.get("MODE") == "daily"
          if (os.environ.get("EV") == "schedule" and os.environ.get("SCH") != "13 0 * * 6") or daily_call:
              kst = dt.datetime.utcnow() + dt.timedelta(hours=9)
              # ★ 102. '가장 최근에 지난' 수집 시각과 비교 (예전엔 00~06시에 돌면 아직 안 온 오늘 06:23 과 비교해 늘 다시 돌았고,
              #        늦게 돈 예약이 미국 장중 값을 만들었습니다). 한국 16:17 · 미국 06:23 · 어제 16:17 중 지금보다 앞선 것
              # ★ 121. 휴장일의 수집 시각은 후보에서 뺍니다 (예전엔 휴일마다 "종가가 아직 오늘이 아님"으로 예약 때마다 다시 돌고 텔레그램도 그만큼 갔음)
              # ★ 257. 휴장일은 config/market.json 한 파일 (앱·서버·파이프라인 공통)
              _cal = json.load(open("config/market.json", encoding="utf-8"))
              KR_HOL, US_HOL = set(_cal["kr"]), set(_cal["us"])
              z = dict(second=0, microsecond=0)
              cands = []
              for back in range(0, 8):
                  day = kst - dt.timedelta(days=back)
                  if day.weekday() < 5 and day.strftime("%Y-%m-%d") not in KR_HOL:
                      cands.append(day.replace(hour=16, minute=17, **z))            # 그날 한국 종가
                  us_day = day - dt.timedelta(days=1)                                  # 06:23 에 받는 것은 전날 미국 종가
                  if us_day.weekday() < 5 and us_day.strftime("%Y-%m-%d") not in US_HOL:
                      cands.append(day.replace(hour=6, minute=23, **z))
              slot = max(x for x in cands if x <= kst)
              try:
                  snap = json.load(open("public/data/snapshot.json"))
                  gen = dt.datetime.strptime(snap["meta"]["generatedKST"], "%Y-%m-%d %H:%M")
                  if gen >= slot: skip = "true"
                  # 한국 슬롯인데 한국 종가 날짜가 아직 오늘이 아니면(야후가 늦게 채움) 건너뛰지 않음
                  kr = max((d.get("asOf") or "" for d in snap.get("stocks", {}).values() if d.get("m") == "kr"), default="")
                  if skip == "true" and slot.hour == 16 and slot.weekday() < 5 and kr < slot.strftime("%Y-%m-%d"):
                      skip = "false"; print(f"한국 종가가 아직 {kr} — 다시 받습니다")
                  # 미국 슬롯(화~토 06:23)인데 미국 종가가 아직 전날 것이 아니면(서머타임 해제 뒤 06시 초반 수집·야후 지연) 건너뛰지 않음
                  us = max((d.get("asOf") or "" for d in snap.get("stocks", {}).values() if d.get("m") == "us"), default="")
                  if skip == "true" and slot.hour == 6 and 1 <= slot.weekday() <= 5 and us < (slot - dt.timedelta(days=1)).strftime("%Y-%m-%d"):
                      skip = "false"; print(f"미국 종가가 아직 {us} — 다시 받습니다")
                  print(f"마지막 생성 {gen} · 이번 슬롯 {slot} → {'건너뜀' if skip == 'true' else '실행'}")
              except Exception as e:
                  print("확인 실패 → 실행:", e)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"skip={skip}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: '3.11'

      # 261. '오늘 살 것'은 앱과 같은 함수(src/picks.js)를 node 로 부름 — config/rules.json 을 읽으려면 node 20.10 이상
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: '20'

      # ① 유니버스·종목명 — 16:00 과 토요일, 그리고 수동 실행에서만
      # ★ 종목풀은 주 1회만 새로 뽑습니다 (토요일 + 수동 실행)
      #   예전엔 평일마다 730종목을 6개월치로 다시 받아 실행 시간의 대부분을 썼습니다.
      #   풀이 매일 바뀌면 신호도 따라 흔들려서, 주 단위로 정리하는 편이 낫습니다.
      - name: ① 종목 목록 (universe.json) — 주간 1회
        if: steps.fresh.outputs.skip != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.mode != 'daily' && inputs.mode != 'quick') || github.event.schedule == '13 0 * * 6')
        run: python scripts/build_universe.py

      # ② 앱이 읽는 지표 스냅샷 — 매번. 외부 라이브러리 없이 표준 라이브러리만 씁니다
      #    종목의 80% 미만만 수집되면 일부러 실패하고 기존 데이터를 지킵니다
      - name: Build snapshot
        if: steps.fresh.outputs.skip != 'true'
        env:
          FOCUS: ${{ ((github.event_name == 'schedule' && github.event.schedule != '13 0 * * 6') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'quick'))) && '1' || '0' }}
        run: python scripts/build_snapshot.py

      - name: Show result
        if: steps.fresh.outputs.skip != 'true'
        run: |
          ls -lh public/data/snapshot.json public/data/market.json
          echo "차트 파일 $(ls public/data/bars | wc -l)개 · $(du -sh public/data/bars | cut -f1)"
          python -c "import json;m=json.load(open('public/data/snapshot.json'))['meta'];print('종목',m['counts']['stocks'],'· 실패',m['counts']['failed'],'· 생성',m['generatedKST']);print('실패목록:',', '.join(m.get('failed',[])) or '없음')"
          python -c "import json;d=json.load(open('public/data/market.json'));print('판단',{k:(v['verdict'],v['gate']) for k,v in d['judge'].items()});print('폭',{k:(v['v'],v['pct']) for k,v in d.get('breadth',{}).items()})"

      # ③ 텔레그램 — 스냅샷이 성공했을 때만
      - name: Telegram report
        if: success() && steps.fresh.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODE: full
          WEEKLY: ${{ (github.event.schedule == '13 0 * * 6') && '1' || '0' }}
        run: python scripts/notify.py

      # ⑤ 커밋 1회 — 스냅샷이 실패해도 universe.json 은 살립니다
      - name: Commit and push
        if: always() && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ★ 259. 폴더 전체를 담고, 파이프라인이 건드리면 안 되는 파일만 뺍니다
          #   예전엔 담을 파일을 하나씩 적어 새 파일을 빠뜨리면 저장이 안 됐음 (2026-10-10 picks_log.json · 11-08 bounce_log.json)
          #   watchlist.json(내 기록) · resv.json(매수 예약)은 앱·서버(api)가 직접 저장 → 여기서 덮어쓰면 안 됨
          git add -A public/data
          git reset -q -- public/data/watchlist.json public/data/resv.json 2>/dev/null || true
          git diff --staged --quiet || (
            git commit -m "📊 $(date -u -d '+9 hours' +%Y-%m-%d_%H:%M) 데이터 + 스냅샷"
            # ★ --autostash: 목록에 없는 파일이 바뀌어 있어도 pull 이 멈추지 않게 (2026-10-10 picks_log.json 로 사흘 저장 실패)
            git pull --rebase --autostash origin main
            git push
          )

      # 153. 실패하면 바로 텔레그램으로 알림 — 2026-10-10 저장 실패를 사흘 뒤에야 알았던 일 방지
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NAME: ${{ github.workflow }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, datetime
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              raise SystemExit("텔레그램 비밀키 없음 — 알림 생략")
          now = (datetime.datetime.utcnow() + datetime.timedelta(hours=9)).strftime("%m/%d %H:%M")
          text = (f"⚠️ <b>자동 수집 실패</b> · {now}\n{os.environ.get('RUN_NAME','')}\n"
                  "앱 데이터가 갱신·저장되지 않았을 수 있습니다. 앱에서 🔄 갱신을 눌러 보고, 계속되면 로그를 확인하세요.\n"
                  f"<a href=\"{os.environ.get('RUN_URL','')}\">실행 로그 열기</a>")
          req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage",
              data=json.dumps({"chat_id": chat, "text": text, "parse_mode": "HTML", "disable_web_page_preview": True}).encode(),
              headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=20).status)
          PY
