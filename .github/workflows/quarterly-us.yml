name: Beta Quarterly US (Full Pool)
# Beta Terminal v0.5 — 미국 풀 전체 재무 수집
# 262. ② 미국 재무 — universe.json 의 미국 종목 → financials_us.json (build_snapshot 이 바로 읽음 · 예전 stocks.json 병합 단계 없앰)
# 시간: ~10분 (500종목 × 1.2초)

on:
  schedule:
    # 224. 매주 일요일 KST 09:30 — 새로 들어온 종목도 1주 안에 재무(적자 여부)가 붙도록 (예전엔 매월 1일 → 한 달 가까이 '재무 없음')
    - cron: '30 0 * * 0'
  workflow_dispatch:  # 수동 트리거도 가능

jobs:
  fetch-us:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Fetch US financials
        run: python scripts/fetch_financials_us.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || (
            git commit -m "📊 Beta 미국 풀 재무 데이터 갱신"
            git pull --rebase --autostash origin main
            git push
          )
