name: Beta Merge Financials → stocks.json
# Beta Terminal v0.5 — financials_us.json을 stocks.json에 병합
# 알파의 다른 필드 (stocks/pool/indices 등) 절대 안 건드림
# 무결성 검증 실패 시 저장 안 함
# 수동 트리거만

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run merge
        run: python scripts/merge_financials.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.json public/data/financials_merge_log.txt
          git diff --staged --quiet || (
            git commit -m "🔗 Beta financials → stocks.json 병합"
            git pull --rebase origin main
            git push
          )
