name: Beta Quarterly Test (PoC)
# Beta Terminal v0.1 — 재무 데이터 PoC
# 미국 10종목 재무 데이터 수집 시도. stocks.json 안 건드림.
# 결과: public/data/financials_test.json (별도 파일)
# 알파 영향: 0% (수동 실행만 + 별도 파일)

on:
  workflow_dispatch:  # 수동 트리거만 — 자동 실행 없음

jobs:
  test-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run PoC
        run: python scripts/test_financials_poc.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/financials_test.json public/data/financials_test_log.txt
          git diff --staged --quiet || (
            git commit -m "🧪 Beta PoC 재무 데이터 수집 결과"
            git pull --rebase origin main
            git push
          )
