name: Beta Quarterly Test (PoC)
# Beta Terminal v0.2 — 재무 데이터 PoC (yfinance 기반)
# 알파 quarterly.yml과 동일한 'pip install yfinance requests' 스택 사용 — 한몸 처럼.
# 미국 10종목 재무 수집. stocks.json 안 건드림. 알파 영향 0%.

on:
  workflow_dispatch:  # 수동 트리거만

jobs:
  test-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run PoC
        run: python scripts/test_financials_poc.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/financials_test.json public/data/financials_test_log.txt
          git diff --staged --quiet || (
            git commit -m "🧪 Beta PoC 재무 데이터 (yfinance v0.2)"
            git pull --rebase origin main
            git push
          )
