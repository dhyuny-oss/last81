name: Beta Quarterly Test (PoC)

# 수동 실행만. 자동 실행 안 됨 → 알파 데이터 보호
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run PoC
        run: python scripts/test_financials_poc.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/financials_test.json public/data/financials_test_log.txt
          git diff --cached --quiet || git commit -m "chore(beta): PoC financial data test results"
          git push
